name: Promote major tag

on:
  release:
    types: [published]

concurrency:
  group: promote-major-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  classify-release:
    name: Classify published release
    runs-on: ubuntu-latest
    outputs:
      is-stable-release: ${{ steps.classify.outputs.is-stable-release }}
    steps:
      - id: classify
        shell: bash
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$IS_PRERELEASE" == false && "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is-stable-release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "is-stable-release=false" >> "$GITHUB_OUTPUT"

  promote-major:
    name: Create signed major tag
    needs: classify-release
    if: ${{ needs.classify-release.outputs.is-stable-release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-signing
    steps:
      - name: Create Runrly Echo token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RUNRLY_ECHO_APP_ID }}
          private-key: ${{ secrets.RUNRLY_ECHO_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Create and verify SSH-signed major tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUNRLY_ECHO_SIGNING_PRIVATE_KEY: ${{ secrets.RUNRLY_ECHO_SIGNING_PRIVATE_KEY }}
        run: .github/scripts/promote-major-release-tag.sh
