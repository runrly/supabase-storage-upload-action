name: Bug report
description: Report unexpected behavior in the Action.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include Supabase keys or other credentials. Report vulnerabilities privately through GitHub Security Advisories.
  - type: input
    id: version
    attributes:
      label: Action version
      placeholder: v1
    required: true
  - type: textarea
    id: workflow
    attributes:
      label: Minimal workflow
      description: Remove all secrets before sharing.
      render: yaml
    required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    required: true
